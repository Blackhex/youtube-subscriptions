<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Subscriptions Organizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container-fluid p-0">
        <nav class="navbar navbar-dark bg-primary px-3 py-2">
            <div class="ms-auto">
                <button id="syncBtn" class="btn btn-icon" title="Sync subscriptions from YouTube">
                    <span class="material-icons">sync</span>
                </button>
            </div>
        </nav>

        <div class="row g-2 p-2">
            <!-- Sidebar: Categories -->
            <aside class="col-12 col-md-3 col-lg-2">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-2">
                        <h6 class="mb-0 fw-semibold">Categories</h6>
                        <div class="btn-group btn-group-sm">
                            <button id="getSuggestionsBtn" class="btn btn-sm btn-primary" style="display: none;" title="Get AI category suggestions">
                                ✨
                            </button>
                            <button id="newCategoryBtn" class="btn btn-sm btn-success">+</button>
                        </div>
                    </div>
                    <div class="list-group list-group-flush">
                        <div class="special-filter-item list-group-item list-group-item-action border-0 py-2 px-3" id="filterAll" onclick="selectSpecialFilter('all')">
                            <span class="filter-icon me-2">📂</span>
                            <span class="filter-label">All Subscriptions</span>
                        </div>
                        <div class="special-filter-item list-group-item list-group-item-action border-0 py-2 px-3" id="filterUncategorized" onclick="selectSpecialFilter('uncategorized')">
                            <span class="filter-icon me-2">📄</span>
                            <span class="filter-label">Uncategorized</span>
                        </div>
                    </div>
                    <div id="categoriesTree" class="categories-tree p-2">
                        <!-- Categories tree will be rendered here -->
                    </div>
                </div>
            </aside>

            <!-- Main content: Subscriptions -->
            <main class="col-12 col-md-9 col-lg-10">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-2">
                        <h6 class="mb-0 fw-semibold" id="contentTitle">All Subscriptions</h6>
                        <div>
                            <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search..." style="width: 200px;">
                        </div>
                    </div>
                    <div id="subscriptionsList" class="subscriptions-list p-2">
                        <!-- Subscriptions will be rendered here -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal: Create/Edit Category -->
    <div id="categoryModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="categoryModalTitle">New Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="categoryForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="catName" class="form-label">Name:</label>
                            <input type="text" id="catName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="catDescription" class="form-label">Description:</label>
                            <textarea id="catDescription" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="catParent" class="form-label">Parent Category:</label>
                            <select id="catParent" class="form-select">
                                <option value="">None (Root)</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="categoryModalClose" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Loading spinner -->
    <div id="loadingSpinner" class="position-fixed top-50 start-50 translate-middle d-none">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
